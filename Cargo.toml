[package]
name = "rustcast"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
ebur128 = "0.1.11"
fastrand = "2.5.0"
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
lofty = "0.25.5"
mp3lame-encoder = "0.3.0"
rubato = "5.1.0"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
symphonia = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
