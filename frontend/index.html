<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKMESA Fm</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="playerShell" class="player-shell">
    <header class="player-topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.svg" alt="BLACKMESA" />
        <span id="stationName">BLACKMESA Fm</span>
      </div>
      <div class="topbar-right">
        <span id="onAirSign" class="on-air-sign" title="Status da transmissão">
          <span class="led"></span>
        </span>
      </div>
    </header>

    <section class="player-card" aria-label="Player">
      <div id="stationPickerRow" class="station-select-row hidden">
        <select id="stationSelect" class="select" aria-label="Estação"></select>
      </div>

      <div class="player-meta-row">
        <span id="sourceBadge" class="badge badge-autodj">
          <span class="dot"></span>
          <span id="sourceText">AutoDJ</span>
        </span>
        <span id="dialPill" class="dial-pill">/radio · 128k</span>
        <span class="listeners-pill" title="Ouvintes">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span id="listenersCount">0</span>
        </span>
      </div>

      <div class="stage-wrap">
        <div class="cover-wrap">
          <div class="cover-disc">
            <img id="coverImg" alt="" class="hidden">
            <div id="coverFallback" class="cover-fallback" aria-hidden="true">
              <img class="cover-fallback-logo" src="logo.svg" alt="" />
            </div>
          </div>
        </div>
        <div class="visualizer-wrap" aria-hidden="true">
          <canvas id="visualizer"></canvas>
        </div>
      </div>

      <div class="track-info">
        <h1 id="trackTitle" class="track-title"></h1>
        <p id="trackArtist" class="track-artist"></p>
      </div>

      <audio id="audio" src="/mount/radio" preload="none"></audio>

      <div class="player-controls">
        <button id="playBtn" class="play-btn" type="button" aria-label="Tocar">
          <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"/>
          </svg>
          <svg id="iconPause" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <div class="volume-wrap">
          <button id="muteBtn" class="icon-btn" type="button" aria-label="Silenciar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path id="volWave" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>
          <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.02" value="0.85" aria-label="Volume">
        </div>

        <button id="shareBtn" class="icon-btn" type="button" aria-label="Copiar link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
        </button>
      </div>

      <div class="player-footer">
        <span id="playerStatus"></span>
        <span id="listenTimer" class="mono">00:00</span>
      </div>
    </section>

    <section id="historyCard" class="history-card hidden" aria-label="Histórico">
      <ul id="historyList" class="history-list"></ul>
    </section>
  </main>

  <script src="player.js"></script>
</body>
</html>
