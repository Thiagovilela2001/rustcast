<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLACKMESA Fm</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="playerShell" class="radio-panel">
    <header class="player-topbar">
      <a class="brand" href="/" aria-label="BLACKMESA Fm">
        <img class="brand-logo" src="logo.svg" alt="BLACKMESA" />
      </a>
      <span id="onAirSign" class="on-air-sign" title="No ar">
        <span class="led"></span>
      </span>
    </header>

    <div id="stationPickerRow" class="station-select-row hidden">
      <select id="stationSelect" class="select" aria-label="Estação"></select>
    </div>

    <section class="studio" aria-label="Player">
      <div class="studio-art" id="studioArt">
        <div class="art-grid" id="artGrid" aria-hidden="true"></div>
        <img id="coverImg" alt="" class="hidden" />
        <div id="coverFallback" class="art-fallback" aria-hidden="true">
          <img class="fallback-logo" src="logo.svg" alt="" />
        </div>
      </div>

      <div class="studio-info">
        <div class="status-row">
          <span id="onAirDot" class="led-dot" aria-hidden="true"></span>
          <span id="listenersCount" class="listeners-chip">0</span>
        </div>

        <div class="track-info">
          <h1 id="trackTitle" class="now-title"></h1>
          <p id="trackArtist" class="now-artist"></p>
        </div>

        <audio id="audio" src="/mount/radio" preload="none"></audio>
        <span id="playerStatus" class="player-status"></span>

        <div class="controls">
          <button id="playBtn" class="bm-btn play-btn" type="button" aria-label="Ouvir ao vivo">
            <svg id="iconPlay" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 4 20 12 6 20 6 4"/>
            </svg>
            <svg id="iconPause" class="hidden" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="4" width="4" height="16"/>
              <rect x="14" y="4" width="4" height="16"/>
            </svg>
          </button>

          <button id="muteBtn" class="bm-btn share-btn mute-btn" type="button" aria-label="Silenciar">
            <svg id="volWave" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </button>
          <div class="volume">
            <input id="volumeSlider" type="range" min="0" max="1" step="0.02" value="0.85" aria-label="Volume">
          </div>

          <button id="shareBtn" class="bm-btn share-btn" type="button" aria-label="Copiar link">
            <span class="share-label">compartilhar</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <section id="historyCard" class="block hidden" aria-label="Tocou há pouco">
      <div class="block-head">
        <h2 class="block-title">tocou há pouco</h2>
        <div class="block-rule" aria-hidden="true"></div>
      </div>
      <ul id="historyList" class="history-list"></ul>
    </section>
  </main>

  <script src="player.js"></script>
</body>
</html>
