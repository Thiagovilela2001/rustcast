<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RustCast — Rádio Ao Vivo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="playerShell" class="player-shell">
    <header class="player-topbar">
      <div class="brand">
        <span class="brand-mark">RC</span>
        <span id="stationName">RustCast Radio</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="onAirSign" class="on-air-sign" title="Status da transmissão">
          <span class="led"></span>
          <span>NO AR</span>
        </span>
        <a class="btn btn-sm" href="admin/">Admin</a>
      </div>
    </header>

    <section class="player-card" aria-label="Player de rádio">
      <div id="stationPickerRow" class="station-select-row hidden">
        <label for="stationSelect" class="muted" style="font-size: 0.85rem;">Estação</label>
        <select id="stationSelect" class="select"></select>
      </div>

      <div class="player-meta-row">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span id="sourceBadge" class="badge badge-autodj">
            <span class="dot"></span>
            <span id="sourceText">AutoDJ</span>
          </span>
          <span id="dialPill" class="dial-pill">/radio · 128k</span>
        </div>
        <span class="listeners-pill" title="Ouvintes conectados">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span id="listenersCount">0</span> ouvintes
        </span>
      </div>

      <div class="stage-wrap">
        <div class="cover-wrap">
          <div class="cover-disc">
            <img id="coverImg" alt="Capa da faixa" class="hidden">
            <div id="coverFallback" class="cover-fallback" aria-hidden="true">
              <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6" opacity="0.35"/>
                <circle cx="12" cy="12" r="2.5"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="visualizer-wrap" aria-hidden="true">
          <canvas id="visualizer"></canvas>
        </div>
      </div>

      <div class="track-info">
        <h1 id="trackTitle" class="track-title">Conectando à rádio...</h1>
        <p id="trackArtist" class="track-artist">Aguardando metadados</p>
      </div>

      <audio id="audio" src="/mount/radio" preload="none"></audio>

      <div class="player-controls">
        <button id="playBtn" class="play-btn" type="button" aria-label="Tocar stream">
          <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"/>
          </svg>
          <svg id="iconPause" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>

        <div class="volume-wrap">
          <button id="muteBtn" class="btn btn-sm" type="button" aria-label="Silenciar" title="Silenciar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path id="volWave" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
          </button>
          <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.02" value="0.85" aria-label="Volume">
        </div>

        <button id="shareBtn" class="btn btn-sm" type="button" title="Copiar link do stream">Copiar stream</button>
      </div>

      <div class="player-footer">
        <span id="playerStatus">Pronto para tocar</span>
        <span id="listenTimer" class="mono">00:00</span>
        <span id="sseStatus" class="mono">SSE: conectando</span>
      </div>
    </section>

    <section id="historyCard" class="history-card hidden" aria-label="Tocadas recentemente">
      <h2 class="history-title">Tocadas recentemente</h2>
      <ul id="historyList" class="history-list"></ul>
    </section>
  </main>

  <script src="player.js"></script>
</body>
</html>
